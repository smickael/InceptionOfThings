apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab-traefik-ingress
  namespace: gitlab
  annotations:
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gitlab.42.fr
  rules:
  - host: gitlab.42.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gitlab-webservice-default
            port:
              number: 8080
  - host: registry.gitlab.42.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gitlab-registry
            port:
              number: 5000
  - host: kas.gitlab.42.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gitlab-kas
            port:
              number: 8150
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: gitlab-headers
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
