apiVersion: v1
kind: Secret
metadata:
  name: gitlab-repo-final
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: GITLAB_URL_PLACEHOLDER
  username: root
  password: GITLAB_PAT_PLACEHOLDER
  insecure: "true"
  enableLfs: "false"
