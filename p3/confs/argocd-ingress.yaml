apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
  annotations:
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - argocd.42.fr
      secretName: argocd-tls
  rules:
    - host: argocd.42.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
